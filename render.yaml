# Free-tier public demo on Render ($0 hosting; you only pay LLM usage).
# Tradeoffs: web service sleeps when idle; no persistent disk (re-upload PDFs after wake);
# free Postgres expires ~30 days after creation unless upgraded.
services:
  - type: web
    name: ai-medical-insurance-checker
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TAMUS_AI_CHAT_API_KEY
        sync: false
      - key: TAMUS_AI_CHAT_API_ENDPOINT
        value: https://chat-api.tamu.ai
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: docsage-lite
      - key: USE_LOCAL_VECTORSTORE
        value: "true"
      - key: ENABLE_AUTH
        value: "true"
      - key: APP_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: INGEST_RATE_LIMIT_PER_MINUTE
        value: "8"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DOCUMENT_TTL_HOURS
        value: "48"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-medical-insurance-db
          property: connectionString
      - key: RENDER
        value: "true"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: FAISS_DIR
        value: /app/data/faiss
      - key: API_PORT
        value: "8000"
      - key: CORS_ORIGINS
        value: "*"
      - key: CHAT_MODEL
        value: protected.gemini-2.5-flash-lite
      - key: EMBEDDING_MODEL
        value: protected.text-embedding-3-small

databases:
  - name: ai-medical-insurance-db
    databaseName: docsage
    user: docsage_user
    plan: free
