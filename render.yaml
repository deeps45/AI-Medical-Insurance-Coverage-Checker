services:
  - type: web
    name: ai-medical-insurance-checker
    env: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: TAMUS_AI_CHAT_API_KEY
        sync: false
      - key: TAMUS_AI_CHAT_API_ENDPOINT
        value: https://chat-api.tamu.ai
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: docsage-lite
      - key: USE_LOCAL_VECTORSTORE
        value: "true"
      - key: ENABLE_AUTH
        value: "false"
      - key: APP_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-medical-insurance-db
          property: connectionString
      - key: BASE_URL
        value: http://localhost:8000
      - key: RENDER
        value: "true"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: FAISS_DIR
        value: /app/data/faiss
      - key: PORT
        value: "8501"

databases:
  - name: ai-medical-insurance-db
    databaseName: docsage
    user: docsage_user
    plan: starter
