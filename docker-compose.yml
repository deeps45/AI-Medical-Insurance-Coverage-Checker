services:
  db:
    image: postgres:16
    container_name: coverage-db
    environment:
      POSTGRES_DB: docsage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docsage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coverage-network

  backend:
    build: ./backend
    container_name: coverage-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/docsage
      - USE_LOCAL_VECTORSTORE=${USE_LOCAL_VECTORSTORE:-true}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - coverage-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: coverage-frontend
    ports:
      - "8502:8501"
    environment:
      - BASE_URL=http://backend:8000
      - RENDER=false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coverage-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  coverage-network:
    driver: bridge
